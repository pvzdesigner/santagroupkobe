# ---------------------------------------------------------------------------
# ORDEM DE INICIALIZACAO RECOMENDADA - santagroupkobe
#
# A pasta config/ nao esta versionada (.gitignore), entao este arquivo serve de
# referencia: copie os blocos abaixo para o seu config/config.cfg, mantendo os
# seus valores de sv_licenseKey, endpoints, steam_webApiKey, etc.
#
# A ordem importa: um resource que usa "@outro/arquivo.lua" ou
# exports["outro"] precisa que "outro" tenha sido iniciado antes.
# ---------------------------------------------------------------------------

# --- CONVARS OBRIGATORIAS --------------------------------------------------
# ox_lib exige OneSync ligado e artifact >= 7290. Sem isso o ox_lib nao entra
# na lista de resources e o vrp (dependency 'ox_lib') nao inicia, o que gera
# todos os erros "No such export vRP:Prepare/Query/Groups".
onesync on
set onesync_population true

# Cidade usada por vrp/variables/wall etc. (resources/[system]/variables/cities/base.lua)
set cityName "Base"

# Idioma das traducoes (vrp/translations.lua, vrp/config/translations.lua)
set language "pt-br"

# Banco de dados (oxmysql)
set mysql_connection_string "mysql://usuario:senha@localhost/santa?charset=utf8mb4"

