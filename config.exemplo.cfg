# ---------------------------------------------------------------------------
# ORDEM DE INICIALIZACAO RECOMENDADA - santagroupkobe
#
# A pasta config/ nao esta versionada (.gitignore), entao este arquivo serve de
# referencia para o seu config/resources.cfg (e para as convars do config.cfg).
#
# Problemas do resources.cfg atual:
#   - "ensure vrp" vem antes de "ensure sx", mas o vrp carrega @sx/linker.lua;
#   - lib, variables, PolyZone e org_system so sobem no "ensure [system]" /
#     "ensure [scripts]", ou seja depois de resources que dependem deles;
#   - com "ensure [scripts]" a ordem dentro da pasta fica por ordem de diretorio,
#     sem garantia nenhuma de dependencia.
#
# Manter os "ensure [system]" / "ensure [assets]" / "ensure [scripts]" no fim e
# seguro: resources ja iniciados sao ignorados, eles funcionam como catch-all.
# ---------------------------------------------------------------------------

# --- CONVARS (ficam no config/config.cfg) ----------------------------------
# set onesync "on"              # ja esta correto no seu config.cfg
# setr cityName "Base"          # exige vrp/config/vehicles/Base.json (hoje ausente)
# setr Language "pt-br"

# --- 1. BIBLIOTECAS E SISTEMA ----------------------------------------------
ensure "likizao_ac"
ensure "oxmysql"
ensure "ox_lib"
ensure "PolyZone"
ensure "screenshot-basic"
ensure "sessionmanager"
ensure "pma-voice"
ensure "queue"
ensure "sx"

# --- 2. CORE ---------------------------------------------------------------
ensure "vrp"
ensure "lib"
ensure "variables"
ensure "org_system"

# --- 3. BIBLIOTECAS DE UI / INTERACAO --------------------------------------
ensure "NativeUI"
ensure "localization"
ensure "keyboard"
ensure "notify"
ensure "target"
ensure "sleepless_interact"
ensure "interactions"
ensure "hint"
ensure "request"
ensure "talknpc"

# --- 4. RESTANTE (catch-all, mantem o comportamento atual) ------------------
ensure "[system]"
ensure "[assets]"
ensure "[scripts]"

stop "empty"
